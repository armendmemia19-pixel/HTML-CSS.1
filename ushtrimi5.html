<!DOCTYPE html>
<html lang="en">
<head>
  <style>
        /* Not visited */
        a:link {
            color: red;
            text-decoration: none;
        }

        /* Visited */
        a:visited {
            color: blue;
            text-decoration: none;
        }

        /* Hover */
        a:hover {
            text-decoration: underline;
        }

        /* Active */
        a:active {
            text-decoration: underline;
        }
    </style>
